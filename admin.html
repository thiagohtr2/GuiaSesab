<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Guias de plantão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#12181d; --paper:#f2f3ef; --card:#fff; --rule:#d9dcd6;
  --pine:#0f5346; --pine-soft:#e4ede9; --muted:#6f7871; --warn:#9a4a22;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;padding:0 0 60px}
button,a,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px}

.masthead{border-bottom:1px solid var(--rule);background:var(--card);margin-bottom:22px}
.masthead .wrap{padding:22px 16px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.masthead h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.masthead .quem{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}

section{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin-bottom:18px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.sec-head h2{margin:0;font-size:16px;font-weight:600}
.sec-head .hint{color:var(--muted);font-size:13px}
.sec-body{padding:18px}

label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--rule);
  border-radius:2px;background:#fcfcfa;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:2px;border:1px solid var(--rule);
  background:#fcfcfa;color:var(--ink);padding:9px 14px;font-size:14px}
button:hover{background:#f0f1ed}
button.primary{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:500}
button.primary:hover{background:#0c4438}
button.primary:disabled{background:#9aa8a2;border-color:#9aa8a2;cursor:not-allowed}
button.link{border:none;background:none;color:var(--pine);text-decoration:underline;
  text-underline-offset:2px;padding:4px 2px}

.login{max-width:380px;margin:60px auto}
.erro{color:var(--warn);font-size:13.5px;margin-top:12px}
.ok{color:var(--pine);font-size:13.5px;margin-top:12px}

.cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cartao{border:1px solid var(--rule);border-radius:2px;padding:13px 15px;background:#fcfcfa}
.cartao .n{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.2}
.cartao .r{font-size:12.5px;color:var(--muted);margin-top:2px}

.tabela{width:100%;border-collapse:collapse;font-size:13.5px}
.tabela th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tabela td{padding:9px 10px;border-bottom:1px solid #eef0ec;vertical-align:top}
.tabela tr:last-child td{border-bottom:none}
.tabela .mono{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.tabela .nome{font-weight:600}
.rolagem{overflow-x:auto}
.vazio{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.nota{background:var(--pine-soft);border-left:2px solid var(--pine);padding:11px 14px;
  font-size:13px;border-radius:0 2px 2px 0;margin-top:16px}
.filtros input{max-width:260px}
</style>

<div class="masthead"><div class="wrap">
  <h1>Painel das guias</h1>
  <span class="quem" id="quem"></span>
</div></div>

<div class="wrap">

<!-- ---------- login ---------- -->
<section id="sec-login" class="login">
  <div class="sec-head"><h2>Acesso restrito</h2></div>
  <div class="sec-body">
    <div style="margin-bottom:14px">
      <label for="f-email">E-mail</label>
      <input type="email" id="f-email" autocomplete="username" inputmode="email">
    </div>
    <div>
      <label for="f-senha">Senha</label>
      <input type="password" id="f-senha" autocomplete="current-password">
    </div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="btn-entrar">Entrar</button>
    </div>
    <div id="msg-login"></div>
  </div>
</section>

<!-- ---------- painel ---------- -->
<div id="painel" style="display:none">

  <section>
    <div class="sec-head"><h2>Resumo</h2>
      <span class="hint" id="periodo-resumo"></span>
      <div style="margin-left:auto" class="row">
        <button id="btn-atualizar">Atualizar</button>
        <button id="btn-csv">Baixar CSV</button>
        <button class="link" id="btn-sair">Sair</button>
      </div>
    </div>
    <div class="sec-body"><div class="cartoes" id="cartoes"></div></div>
  </section>

  <section>
    <div class="sec-head"><h2>Guias emitidas</h2>
      <span class="hint" id="contagem"></span>
      <div style="margin-left:auto" class="filtros">
        <input type="text" id="f-busca" placeholder="filtrar por nome, CRM ou unidade">
      </div>
    </div>
    <div class="rolagem"><table class="tabela" id="tabela"></table></div>
    <div class="vazio" id="vazio" style="display:none">Nenhuma guia emitida ainda.</div>
  </section>

  <section>
    <div class="sec-head"><h2>Alterar senha</h2>
      <span class="hint">vale também para o Mapa do Centro Cirúrgico</span></div>
    <div class="sec-body">
      <div class="row" style="align-items:flex-end">
        <div style="flex:1;min-width:200px">
          <label for="f-nova">Nova senha</label>
          <input type="password" id="f-nova" autocomplete="new-password">
        </div>
        <div style="flex:1;min-width:200px">
          <label for="f-nova2">Repita a nova senha</label>
          <input type="password" id="f-nova2" autocomplete="new-password">
        </div>
        <button class="primary" id="btn-senha">Alterar</button>
      </div>
      <div id="msg-senha"></div>
      <div class="nota">Esta conta é a mesma que você usa no Mapa do Centro Cirúrgico.
        Trocar a senha aqui troca lá também.</div>
    </div>
  </section>

</div>
</div>

<script>
const SUPA_URL = "https://kzjnyjqacqgecsogukiq.supabase.co";
const SUPA_KEY = "sb_publishable_V9HCDIq873ev31v3fpYNrw_hTUp-0uP";
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho",
               "agosto","setembro","outubro","novembro","dezembro"];
const NOMES_CAT = { plantonista:"Plantonista 12h", coordenacao:"Coordenação", diarista:"Diarista",
                    ambulatorio:"Ambulatório", interconsultor:"Interconsultor",
                    procedimentos:"Procedimentos" };

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let sessao = null, linhas = [];

/* a sessão vive só nesta aba e some ao fechar */
const guardar = s => { try{ sessionStorage.setItem("ses", JSON.stringify(s)); }catch(e){} };
const recuperar = () => { try{ return JSON.parse(sessionStorage.getItem("ses")||"null"); }catch(e){ return null; } };
const esquecer = () => { try{ sessionStorage.removeItem("ses"); }catch(e){} };

async function entrar(email, senha){
  const r = await fetch(SUPA_URL + "/auth/v1/token?grant_type=password", {
    method:"POST", headers:{ "apikey":SUPA_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password: senha })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || "E-mail ou senha incorretos.");
  return d;
}

async function carregar(){
  const r = await fetch(SUPA_URL +
    "/rest/v1/guias_emitidas?select=*&order=criado_em.desc&limit=2000", {
    headers: { "apikey":SUPA_KEY, "Authorization":"Bearer " + sessao.access_token }
  });
  if(r.status === 401){ sair(); throw new Error("Sessão expirada. Entre de novo."); }
  if(!r.ok) throw new Error("Não foi possível ler o banco.");
  return await r.json();
}

function pinta(){
  const busca = ($("#f-busca").value || "").trim().toLowerCase();
  const vis = linhas.filter(l => !busca ||
    [l.nome, l.registro, l.rqe, l.unidade, l.especialidade]
      .some(c => String(c||"").toLowerCase().includes(busca)));

  /* cartões de resumo */
  const pessoas = new Set(vis.map(l => (l.nome||"").trim().toLowerCase()));
  const horas = vis.reduce((a,l) => a + (l.total_horas||0), 0);
  const folhas = vis.reduce((a,l) => a + (l.folhas||0), 0);
  const agora = new Date();
  const mes30 = vis.filter(l => (agora - new Date(l.criado_em)) < 30*86400000).length;
  $("#cartoes").innerHTML = [
    [vis.length, "guias emitidas"],
    [pessoas.size, pessoas.size === 1 ? "profissional" : "profissionais"],
    [mes30, "nos últimos 30 dias"],
    [folhas, "folhas de guia"],
    [horas + "h", "horas declaradas"],
  ].map(([n,r]) => '<div class="cartao"><div class="n">'+esc(n)+
    '</div><div class="r">'+esc(r)+'</div></div>').join("");

  if(vis.length){
    const datas = vis.map(l => new Date(l.criado_em)).sort((a,b)=>a-b);
    $("#periodo-resumo").textContent = "de " + datas[0].toLocaleDateString("pt-BR") +
      " a " + datas[datas.length-1].toLocaleDateString("pt-BR");
  } else $("#periodo-resumo").textContent = "";

  /* tabela */
  $("#contagem").textContent = vis.length + (vis.length === 1 ? " registro" : " registros");
  $("#vazio").style.display = vis.length ? "none" : "";
  $("#tabela").innerHTML = !vis.length ? "" :
    "<thead><tr><th>Emitida em</th><th>Profissional</th><th>Conselho</th>" +
    "<th>Referência</th><th>Folhas</th><th>Horas</th><th>Categorias</th></tr></thead><tbody>" +
    vis.map(l => {
      const d = new Date(l.criado_em);
      const cats = l.detalhe && l.detalhe.categorias
        ? Object.entries(l.detalhe.categorias)
            .map(([k,v]) => (NOMES_CAT[k]||k) + " " + v + "h").join(" · ")
        : "—";
      const conselho = [l.registro && ("CRM " + l.registro), l.rqe && ("RQE " + l.rqe)]
        .filter(Boolean).join(" | ") || "—";
      return "<tr>" +
        '<td class="mono">' + d.toLocaleDateString("pt-BR") + " " +
          d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) + "</td>" +
        '<td class="nome">' + esc(l.nome) +
          '<div style="font-weight:400;color:var(--muted);font-size:12px">' +
          esc(l.especialidade||"") + (l.unidade ? " · " + esc(l.unidade) : "") + "</div></td>" +
        '<td class="mono">' + esc(conselho) + "</td>" +
        "<td>" + esc(MESES[l.mes] || "?") + "/" + esc(l.ano) + "</td>" +
        '<td class="mono">' + esc(l.folhas) + "</td>" +
        '<td class="mono">' + esc(l.total_horas) + "h</td>" +
        '<td style="font-size:12.5px;color:var(--muted)">' + esc(cats) + "</td></tr>";
    }).join("") + "</tbody>";
}

function baixarCsv(){
  const cab = ["Emitida em","Profissional","CRM","RQE","Especialidade","Unidade",
               "Empresa","Mes","Ano","Folhas","Horas"];
  const linhasCsv = linhas.map(l => [
    new Date(l.criado_em).toLocaleString("pt-BR"), l.nome, l.registro, l.rqe,
    l.especialidade, l.unidade, l.empresa, (MESES[l.mes]||""), l.ano, l.folhas, l.total_horas
  ]);
  const txt = [cab].concat(linhasCsv)
    .map(r => r.map(c => '"' + String(c==null?"":c).replace(/"/g,'""') + '"').join(";"))
    .join("\r\n");
  const url = URL.createObjectURL(new Blob(["\ufeff"+txt], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = "guias-emitidas.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function atualizar(){
  const b = $("#btn-atualizar");
  b.disabled = true; b.textContent = "Carregando…";
  try{ linhas = await carregar(); pinta(); }
  catch(e){ alert(e.message); }
  b.disabled = false; b.textContent = "Atualizar";
}

function abrirPainel(){
  $("#sec-login").style.display = "none";
  $("#painel").style.display = "";
  $("#quem").textContent = (sessao.user && sessao.user.email) || "";
  atualizar();
}

function sair(){
  sessao = null; esquecer();
  $("#painel").style.display = "none";
  $("#sec-login").style.display = "";
  $("#quem").textContent = "";
  $("#f-senha").value = "";
}

$("#btn-entrar").onclick = async () => {
  const b = $("#btn-entrar"), m = $("#msg-login");
  m.textContent = ""; m.className = "";
  b.disabled = true; b.textContent = "Entrando…";
  try{
    sessao = await entrar($("#f-email").value.trim(), $("#f-senha").value);
    guardar(sessao);
    abrirPainel();
  }catch(e){ m.textContent = e.message; m.className = "erro"; }
  b.disabled = false; b.textContent = "Entrar";
};
$("#f-senha").addEventListener("keydown", e => { if(e.key === "Enter") $("#btn-entrar").click(); });

$("#btn-senha").onclick = async () => {
  const m = $("#msg-senha"), nova = $("#f-nova").value, nova2 = $("#f-nova2").value;
  m.textContent = ""; m.className = "";
  if(nova.length < 8){ m.textContent = "Use ao menos 8 caracteres."; m.className = "erro"; return; }
  if(nova !== nova2){ m.textContent = "As duas senhas não conferem."; m.className = "erro"; return; }
  const b = $("#btn-senha");
  b.disabled = true; b.textContent = "Alterando…";
  try{
    const r = await fetch(SUPA_URL + "/auth/v1/user", {
      method:"PUT",
      headers:{ "apikey":SUPA_KEY, "Content-Type":"application/json",
                "Authorization":"Bearer " + sessao.access_token },
      body: JSON.stringify({ password: nova })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.msg || d.error_description || "Não foi possível alterar.");
    $("#f-nova").value = ""; $("#f-nova2").value = "";
    m.textContent = "Senha alterada. Vale também para o Mapa do Centro Cirúrgico.";
    m.className = "ok";
  }catch(e){ m.textContent = e.message; m.className = "erro"; }
  b.disabled = false; b.textContent = "Alterar";
};

$("#btn-atualizar").onclick = atualizar;
$("#btn-csv").onclick = baixarCsv;
$("#btn-sair").onclick = sair;
$("#f-busca").oninput = pinta;

sessao = recuperar();
if(sessao && sessao.access_token) abrirPainel();
</script>
